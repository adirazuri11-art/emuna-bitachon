<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF4"/><stop offset="0.72" stop-color="#F3EDE0"/><stop offset="1" stop-color="#E2D8C3"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#4A3A1E" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="leather" cx="0.35" cy="0.25" r="1.1">
      <stop offset="0" stop-color="#8A5A2E"/><stop offset="0.55" stop-color="#63401F"/><stop offset="1" stop-color="#3E2712"/>
    </radialGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B58A2C"/><stop offset="0.3" stop-color="#F2DE9E"/><stop offset="0.55" stop-color="#D4AF37"/><stop offset="1" stop-color="#8F6B1B"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C8A245"/><stop offset="0.4" stop-color="#F2DE9E"/><stop offset="1" stop-color="#A87F26"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#vig)"/>
  <ellipse cx="200" cy="424" rx="145" ry="15" fill="#3A3020" opacity="0.24" filter="url(#soft)"/>

  <!-- הספר בזווית קלה -->
  <g transform="rotate(-4 200 280)">
    <!-- גוש דפים מוזהב -->
    <path d="M290 158 L306 166 L306 398 L290 390 Z" fill="url(#pages)"/>
    <g stroke="#8F6B1B" stroke-width="0.8" opacity="0.6">
      <path d="M294 163 L294 393"/><path d="M298 165 L298 395"/><path d="M302 167 L302 397"/>
    </g>
    <path d="M108 390 L290 390 L306 398 L124 398 Z" fill="#E8D48B"/>
    <!-- כריכת עור -->
    <rect x="92" y="140" width="200" height="252" rx="10" fill="url(#leather)"/>
    <!-- טקסטורת עור עדינה -->
    <g stroke="#2E1D0C" stroke-width="0.8" opacity="0.35">
      <path d="M110 170 C150 176 240 176 276 170"/>
      <path d="M108 350 C150 358 240 358 278 350"/>
    </g>
    <!-- מסגרת מוטבעת זהב -->
    <rect x="110" y="158" width="164" height="216" rx="7" fill="none" stroke="url(#gd)" stroke-width="2.6"/>
    <rect x="117" y="165" width="150" height="202" rx="5" fill="none" stroke="url(#gd)" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
    <g stroke="url(#gd)" stroke-width="1.8" fill="none">
      <path d="M116 176 q10 -12 22 -12"/><path d="M268 176 q-10 -12 -22 -12"/>
      <path d="M116 356 q10 12 22 12"/><path d="M268 356 q-10 12 -22 12"/>
    </g>
    <!-- מדליון מרכזי -->
    <circle cx="192" cy="240" r="34" fill="none" stroke="url(#gd)" stroke-width="2.4"/>
    <circle cx="192" cy="240" r="27" fill="none" stroke="url(#gd)" stroke-width="0.9" opacity="0.7"/>
    <g stroke="url(#gd)" stroke-width="2.4" fill="none" stroke-linejoin="round">
      <path d="M192 218 L212 253 L172 253 Z"/>
      <path d="M192 262 L172 227 L212 227 Z"/>
    </g>
    <!-- שורת הטבעת שם (מקום מיועד) -->
    <path d="M140 322 h104" stroke="url(#gd)" stroke-width="1.4" stroke-dasharray="2 3" opacity="0.75"/>
    <!-- ברק על העור -->
    <ellipse cx="150" cy="196" rx="40" ry="22" fill="#FFFFFF" opacity="0.07" filter="url(#soft)"/>
    <!-- סימנייה -->
    <path d="M246 392 L246 428 L257 417 L268 428 L268 392 Z" fill="#8E2434"/>
    <path d="M247 392 L247 424" stroke="#6E1A28" stroke-width="1.5"/>
  </g>
</svg>
