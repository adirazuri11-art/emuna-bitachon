<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF4"/><stop offset="0.72" stop-color="#F3EDE0"/><stop offset="1" stop-color="#E2D8C3"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#4A3A1E" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9743C"/><stop offset="0.5" stop-color="#8A5A2B"/><stop offset="1" stop-color="#5F3D1C"/>
    </linearGradient>
    <radialGradient id="bread" cx="0.4" cy="0.3" r="1">
      <stop offset="0" stop-color="#F2C983"/><stop offset="0.6" stop-color="#D99A4E"/><stop offset="1" stop-color="#A5661F"/>
    </radialGradient>
    <linearGradient id="sv" x1="0" y1="0" x2="1" y2="0">
