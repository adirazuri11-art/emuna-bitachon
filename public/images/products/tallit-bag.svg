<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFAF4"/><stop offset="0.72" stop-color="#F3EDE0"/><stop offset="1" stop-color="#E2D8C3"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#4A3A1E" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="velvet" cx="0.35" cy="0.25" r="1.1">
      <stop offset="0" stop-color="#33478C"/><stop offset="0.55" stop-color="#1F2E63"/><stop offset="1" stop-color="#131C42"/>
    </radialGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B58A2C"/><stop offset="0.3" stop-color="#F2DE9E"/><stop offset="0.55" stop-color="#D4AF37"/><stop offset="1" stop-color="#8F6B1B"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <rect width="400" height="500" fill="url(#vig)"/>
  <ellipse cx="200" cy="420" rx="145" ry="16" fill="#3A3020" opacity="0.24" filter="url(#soft)"/>

  <!-- התיק: קטיפה בפרספקטיבה קלה -->
  <g transform="rotate(-2 200 280)">
    <rect x="84" y="150" width="232" height="262" rx="16" fill="url(#velvet)"/>
    <!-- ברק קטיפה אלכסוני -->
    <path d="M95 160 L305 400" stroke="#FFFFFF" stroke-width="60" opacity="0.045" stroke-linecap="round"/>
    <path d="M130 155 L320 370" stroke="#FFFFFF" stroke-width="24" opacity="0.05" stroke-linecap="round"/>
    <!-- רוכסן -->
    <line x1="96" y1="170" x2="304" y2="170" stroke="#8F6B1B" stroke-width="2"/>
    <line x1="96" y1="170" x2="304" y2="170" stroke="url(#gd)" stroke-width="3" stroke-dasharray="3.5 3"/>
    <rect x="282" y="163" width="18" height="9" rx="4" fill="url(#gd)"/>
    <path d="M300 167 L310 174" stroke="#8F6B1B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- מסגרת רקומה כפולה -->
    <rect x="106" y="192" width="188" height="188" rx="12" fill="none" stroke="url(#gd)" stroke-width="3"/>
    <rect x="114" y="200" width="172" height="172" rx="9" fill="none" stroke="url(#gd)" stroke-width="1.2" stroke-dasharray="5 4"/>
    <!-- עיטורי פינה -->
    <g stroke="url(#gd)" stroke-width="2" fill="none">
      <path d="M112 210 q12 -14 26 -14"/><path d="M288 210 q-12 -14 -26 -14"/>
      <path d="M112 362 q12 14 26 14"/><path d="M288 362 q-12 14 -26 14"/>
    </g>
    <!-- כתר -->
    <path d="M180 226 L185 208 L193 220 L200 204 L207 220 L215 208 L220 226 Z" fill="url(#gd)"/>
    <circle cx="185" cy="205" r="2.5" fill="#F2DE9E"/><circle cx="200" cy="201" r="2.5" fill="#F2DE9E"/><circle cx="215" cy="205" r="2.5" fill="#F2DE9E"/>
    <!-- מגן דוד רקום -->
    <g stroke="url(#gd)" stroke-width="3.4" fill="none" stroke-linejoin="round">
      <path d="M200 244 L234 302 L166 302 Z"/>
      <path d="M200 328 L166 270 L234 270 Z"/>
    </g>
    <!-- שורת רקמה תחתונה (מקום לשם) -->
    <path d="M140 352 h120" stroke="url(#gd)" stroke-width="1.6" stroke-dasharray="2 3" opacity="0.8"/>
  </g>
</svg>
